[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "reuseloader"
version = "0.1.0"
description = "Deterministic sample-reuse schedule and disk-backed DataLoader for PyTorch input bottlenecks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Tyndall-log" },
]
keywords = [
  "pytorch",
  "dataloader",
  "data-echoing",
  "reproducibility",
  "cache",
  "machine-learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.1.0",
]

[project.urls]
Documentation = "https://github.com/Tyndall-log/reuseloader#readme"
Source = "https://github.com/Tyndall-log/reuseloader"
Issues = "https://github.com/Tyndall-log/reuseloader/issues"

[project.optional-dependencies]
dev = [
  "numpy>=1.26.0",
  "pytest>=8.3.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reuseloader"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--basetemp=.tmp_pytest"]
